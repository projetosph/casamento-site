<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">P & A</div>
  <a href="index.html" class="btnHeader">Sair</a>
</header>

<section class="painel-container">

  <h2 class="nomes">PAINEL DOS NOIVOS</h2>

  <!-- ===== PRODUTOS ===== -->
  <div class="bloco">
    <div class="tituloBloco" onclick="toggleBloco(this)">
      Adicionar / Editar Presente
    </div>

    <div class="conteudoBloco">

      <input id="nomeProduto" placeholder="Nome do presente" class="inputNome">
      <input id="valorProduto" placeholder="Valor total" class="inputNome">
      <input id="cotaProduto" placeholder="Valor da cota" class="inputNome">
      <input id="imagemProduto" placeholder="URL da imagem" class="inputNome">


      <button class="btnFinalizar" onclick="salvarProduto()">SALVAR</button>

      <input type="hidden" id="editIndex">

      <div id="listaProdutos"></div>

    </div>
  </div>

  <!-- ===== PRESENÇA ===== -->
  <div class="bloco">
    <div class="tituloBloco" onclick="toggleBloco(this)">
      Lista de Presença
    </div>

    <div class="conteudoBloco" id="presencas"></div>
  </div>

  <!-- ===== RECADOS ===== -->
  <div class="bloco">
    <div class="tituloBloco" onclick="toggleBloco(this)">
      Recados
    </div>

    <div class="conteudoBloco" id="recados"></div>
  </div>
  <div class="bloco">

  <div class="tituloBloco" onclick="toggleBloco(this)">
    Galeria de Fotos
  </div>

<div class="conteudoBloco">

  <input id="fotoUrl" class="inputNome" placeholder="URL da imagem">
  <button onclick="adicionarFoto()">ADICIONAR FOTO</button>


  <div id="listaFotos"></div>

</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  carregarProdutosAdmin();
  carregarPresencasAdmin();
  carregarRecadosAdmin();
});
</script>

<script src="script.js"></script>
<script src="galeria.js"></script>
</body>
</html>
