<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação de Presença</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">P & A</div>
  <a href="index.html" class="btnHeader">Voltar</a>
</header>

<section class="pagamento-container">

  <h1 class="nomes">PAULO & ALANA</h1>
  <div class="linhaDecorativa"></div>

  <p class="subtitulo">CONFIRMAÇÃO DE PRESENÇA</p>

  <input
  id="nomePresenca"
  class="inputNome"
  placeholder="Seu nome e sobrenome">

  <input
    id="quantidadePresenca"
    type="number"
    min="1"
    max="10"
    class="inputNome"
    placeholder="Quantidade de pessoas"
    oninput="criarCamposConvidados()">

  <div id="listaNomesConvidados"></div>

  <textarea id="mensagem" placeholder="Deixe uma mensagem (opcional)"></textarea>

  <button class="btnFinalizar" onclick="confirmarPresenca()">
    CONFIRMAR PRESENÇA
  </button>

  <div id="listaPresenca"></div>

</section>

<script src="script.js"></script>

</body>
</html>
